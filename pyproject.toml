[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-allocation"
version = "2.8.9"
description = "Personal asset allocation and position pricing"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "playwright>=1.40",
    "ccy",
    "curl_cffi",
    "pycountry",
    "pytr",
    "yfinance",
]

[project.scripts]
asalloc = "cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"

[tool.setuptools]
py-modules = ["utils"]
packages = ["position", "visual", "visual.plot", "visual.web", "visual.web.backend", "portfolio", "scrape", "storage", "cli"]
