[server]
address = localhost
port = 8765
directory = ~/.local/asalloc/visualizer
plotter_data_dir = data
backend = sqlite
postgres_dsn = postgresql://localhost/asalloc
db_file = ~/.local/asalloc/asalloc.db

[update]
user = default
fetch_prices = False
fetch_geosplit = False
fetch_sectorsplit = False
log_level = INFO

[plotter]
type = web
output_dir = ~/.local/asalloc/visualizer/data
