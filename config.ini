[server]
address = localhost
port = 8765
directory = ~/.local/asalloc/visualizer
plotter_data_dir = data
backend = json
postgres_dsn = postgresql://localhost/asalloc

[update]
user = default
fetch_prices = False
fetch_geosplit = False
fetch_sectorsplit = False
log_level = INFO
assets_file = ~/.local/asalloc/assets.json
cache_file = ~/.local/asalloc/cache.json
isin_file = ~/.local/asalloc/isin.json
users_file = ~/.local/asalloc/users.json

[plotter]
type = web
output_dir = ~/.local/asalloc/visualizer/data
