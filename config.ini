[server]
address = localhost
port = 8765
directory = ~/.local/asalloc/visualizer
plotter_data_dir = data

[update]
plot_clear = True
plot_incognito = True
fetch_prices = False
fetch_geosplit = False
fetch_sectorsplit = False
log_level = INFO
assets_file = ~/.local/asalloc/assets.json
cache_file = ~/.local/asalloc/cache.json

[plotter]
type = web
clear_directory = clear
incognito_directory = incognito
output_dir = ~/.local/asalloc/visualizer/data